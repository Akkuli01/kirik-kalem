<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL =
        "https://idaxxculusfumyknwgid.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_mSQ2DEn9KsMcdPDVq9FpDA_SsnPoF_d";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* BU ŞİİRİN ID'Sİ */

    const poemId = "can-ali";


    /* YASAKLI İÇERİKLER */

    const bannedWords = [
        "mal",
        "amk",
        "aq",
        "orospu",
        "piç",
        "siktir",
        "sikik",
        "yarrak",
        "ibne",
        "göt",
        "salak",
        "aptal",
        "gerizekalı",
        "şerefsiz",
        "haysiyetsiz",
        "oe",
        "orospu çocuğu"
    ];


    function normalizeText(text) {

        return text
            .toLocaleLowerCase("tr-TR")
            .replace(/[^a-zçğıöşü0-9\s]/gi, " ")
            .replace(/\s+/g, " ")
            .trim();

    }


    function containsBannedContent(text) {

        const normalized = normalizeText(text);

        const words = normalized.split(" ");

        return bannedWords.some(function(word) {

            return words.includes(
                normalizeText(word)
            );

        });

    }


    /* YORUMLARI GETİR */

    async function loadComments() {

        const commentsList =
            document.getElementById("commentsList");

        const result =
            await supabaseClient
                .from("comments")
                .select(
                    "author_name, content, created_at"
                )
                .eq("poem_id", poemId)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            console.error(
                "Supabase yorum hatası:",
                result.error
            );

            commentsList.innerHTML =
                "<p>Yorumlar yüklenirken bir hata oluştu.</p>" +
                "<p style='color:red; font-size:14px;'>" +
                result.error.message +
                "</p>";

            return;

        }


        const data = result.data;


        if (!data || data.length === 0) {

            commentsList.innerHTML =
                "<p>Henüz yorum yapılmamış. İlk yorumu sen yap! ✍️</p>";

            return;

        }


        commentsList.innerHTML = "";


        data.forEach(function(comment) {

            const commentElement =
                document.createElement("div");

            commentElement.className =
                "comment";


            const author =
                document.createElement("div");

            author.className =
                "comment-author";

            author.textContent =
                comment.author_name;


            const date =
                document.createElement("div");

            date.className =
                "comment-date";

            date.textContent =
                new Date(
                    comment.created_at
                ).toLocaleString("tr-TR");


            const text =
                document.createElement("div");

            text.className =
                "comment-text";

            text.textContent =
                comment.content;


            commentElement.appendChild(author);
            commentElement.appendChild(date);
            commentElement.appendChild(text);

            commentsList.appendChild(
                commentElement
            );

        });

    }


    /* YORUM GÖNDER */

    document
        .getElementById("commentForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const authorName =
                    document
                        .getElementById("authorName")
                        .value
                        .trim();


                const commentText =
                    document
                        .getElementById("commentText")
                        .value
                        .trim();


                const message =
                    document.getElementById(
                        "commentMessage"
                    );


                message.textContent = "";


                if (
                    !authorName ||
                    !commentText
                ) {

                    message.textContent =
                        "Lütfen adınızı ve yorumunuzu yazın.";

                    return;

                }


                if (
                    containsBannedContent(authorName) ||
                    containsBannedContent(commentText)
                ) {

                    message.textContent =
                        "Yorumunuz topluluk kurallarımıza uygun değil. Küfür, hakaret, aşırı argo, siyasi içerik veya dinî değerlere yönelik aşağılayıcı ifadeler kullanılamaz.";

                    return;

                }


                const result =
                    await supabaseClient
                        .from("comments")
                        .insert({

                            author_name:
                                authorName,

                            content:
                                commentText,

                            poem_id:
                                poemId

                        });


                if (result.error) {

                    console.error(
                        "Yorum gönderme hatası:",
                        result.error
                    );

                    message.textContent =
                        "Yorum gönderilemedi. Lütfen tekrar deneyin.";

                    return;

                }


                message.textContent =
                    "Yorumunuz yayınlandı! ❤️";


                document
                    .getElementById(
                        "commentForm"
                    )
                    .reset();


                loadComments();

            }
        );


    /* BEĞENİLERİ GETİR */

    async function loadLikes() {

        const likeCount =
            document.getElementById("likeCount");


        const result =
            await supabaseClient
                .from("likes")
                .select(
                    "id",
                    {
                        count: "exact",
                        head: true
                    }
                )
                .eq(
                    "poem_id",
                    poemId
                );


        if (result.error) {

            console.error(
                "Beğeni yükleme hatası:",
                result.error
            );

            likeCount.textContent = "0";

            return;

        }


        likeCount.textContent =
            result.count || 0;

    }


    /* BEĞENİ GÖNDER */

    document
        .getElementById("likeButton")
        .addEventListener(
            "click",
            async function() {

                const button =
                    document.getElementById(
                        "likeButton"
                    );

                const message =
                    document.getElementById(
                        "likeMessage"
                    );


                button.disabled = true;


                const result =
                    await supabaseClient
                        .from("likes")
                        .insert({

                            poem_id:
                                poemId

                        });


                if (result.error) {

                    console.error(
                        "Beğeni gönderme hatası:",
                        result.error
                    );

                    message.textContent =
                        "Beğeni gönderilemedi.";

                    button.disabled = false;

                    return;

                }


                button.classList.add("liked");

                message.textContent =
                    "Beğendiğin için teşekkürler! ❤️";

                await loadLikes();


                setTimeout(
                    function() {

                        button.disabled = false;

                    },
                    1000
                );

            }
        );


    /* SAYFA AÇILINCA */

    loadComments();
    loadLikes();

</script>
